version: 1
backend:
  phases:
    preBuild:
      commands:
        - yum install -y python3 make gcc-c++ || echo "Build tools already available"
    build:
      commands:
        - npm ci --include=optional
        - npm rebuild @parcel/watcher --build-from-source
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - cd app && npm ci
    build:
      commands:
        - cd app && npm run build
  artifacts:
    baseDirectory: app/dist
    files:
      - '**/*'
  cache:
    paths:
      - app/node_modules/**/*
