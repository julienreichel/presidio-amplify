version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --include=optional
        - 'npm rebuild @parcel/watcher || echo "Warning - Failed to rebuild @parcel/watcher"'
        - npm run deploy
frontend:
  phases:
    preBuild:
      commands:
        - cd app && npm ci
    build:
      commands:
        - cd app && npm run build
  artifacts:
    baseDirectory: app/dist
    files:
      - '**/*'
  cache:
    paths:
      - app/node_modules/**/*
