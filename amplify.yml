version: 1
# Backend is deployed via GitHub Actions (see .github/workflows/deploy.yml)
# Amplify Hosting only builds the frontend
frontend:
  phases:
    preBuild:
      commands:
        - cd app && npm ci
    build:
      commands:
        - cd app && npm run build
  artifacts:
    baseDirectory: app/dist
    files:
      - '**/*'
  cache:
    paths:
      - app/node_modules/**/*
